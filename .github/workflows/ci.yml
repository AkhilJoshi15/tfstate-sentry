name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test-race
      - name: Build
        run: make build
      - name: Synthetic scan smoke test
        run: make scan-demo
