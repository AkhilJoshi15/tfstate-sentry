name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Format check
        run: make fmt-check
      - name: Vet
        run: make vet
      - name: Test
        run: make test-race
      - name: Build
        run: make build
      - name: Synthetic scan smoke test
        run: make scan-demo
