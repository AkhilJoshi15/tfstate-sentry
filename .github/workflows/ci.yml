name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Format check
        run: make fmt-check
      - name: Version consistency
        run: make check-version
      - name: Vet
        run: make vet
      - name: Test
        run: make test-race
      - name: Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          awk -v total="$total" 'BEGIN { if (total + 0 < 70) exit 1 }'
      - name: Scanner benchmark smoke test
        run: go test -run '^$' -bench BenchmarkScanLargePlan -benchtime=1x ./internal/detector
      - name: Build
        run: make build
      - name: Synthetic scan smoke test
        run: make scan-demo
